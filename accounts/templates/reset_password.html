{% extends "base.html" %}

{% block title %}
Reset Password
{% endblock %}

{% block content %}

<style>
body{
    background:#F5F4FB;
}

.form-container{
    max-width:550px;
    margin:40px auto;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 6px 20px rgba(0,0,0,.12);
}

.btn-theme{
    background:#306280;
    color:white;
}

.btn-theme:hover{
    background:#244b63;
    color:white;
}
</style>

<div class="container">

    <div class="form-container">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h3 class="mb-1">Reset Password</h3>
                <p class="text-muted mb-0">
                    {{ profile.employee_name }} ({{ profile.user.username }})
                </p>
            </div>

            <a href="{% url 'user_management' %}"
               class="btn btn-outline-secondary btn-sm">
                ← Back
            </a>

        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">New Password</label>

                <input
                    type="password"
                    class="form-control"
                    name="new_password"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">Confirm Password</label>

                <input
                    type="password"
                    class="form-control"
                    name="confirm_password"
                    required>

            </div>

            <button type="submit" class="btn btn-theme w-100">
                Reset Password
            </button>

        </form>

    </div>

</div>

{% endblock %}
