{% load static %}

<style>
/* =====================================
   WWA Portal Header
===================================== */

.custom-navbar{
    background:#FFFFFF;
    border-bottom:2px solid #E5E7EB;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
    padding:12px 24px;
}

.portal-logo{
    width:42px;
    height:42px;
    border-radius:10px;
}

.portal-title{
    color:#1D5FE9;
    font-size:24px;
    font-weight:700;
    font-family:"Segoe UI", Arial, sans-serif;
    margin-left:12px;
}

.date-box{
    background:#EEF5FF;
    color:#1D5FE9;
    padding:8px 16px;
    border-radius:25px;
    font-size:14px;
    font-weight:600;
    border:1px solid #BFD8FF;
}

.logout-btn{
    background:#DC3545;
    color:white;
    border:none;
    border-radius:10px;
    padding:8px 18px;
    font-size:14px;
    font-weight:600;
    transition:.3s;
}

.logout-btn:hover{
    background:#BB2D3B;
    color:white;
}
</style>

<nav class="navbar custom-navbar">

    <div class="container-fluid">

        <div class="d-flex justify-content-between align-items-center w-100">

            <!-- Left -->
            <div class="d-flex align-items-center">

                <!-- Optional Logo -->
                {% comment %}
                <img src="{% static 'images/shipco_logo.png' %}"
                     class="portal-logo"
                     alt="WWA Logo">
                {% endcomment %}

                <h3 class="portal-title mb-0">
                    WWA Automation Portal
                </h3>

            </div>

            <!-- Right -->
            <div class="d-flex align-items-center gap-3">

                <div class="date-box">
                    📅 <span id="todayDate"></span>
                </div>

                <form method="POST" action="{% url 'logout' %}" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="logout-btn">
                        Logout
                    </button>
                </form>

            </div>

        </div>

    </div>

</nav>

<script>
const today = new Date();

document.getElementById("todayDate").innerHTML =
today.toLocaleDateString("en-IN",{
    weekday:"long",
    day:"numeric",
    month:"long",
    year:"numeric"
});
</script>
